; ============================================================
;  Outsee — réglages PHP de production (VPS)
;  Installé dans /etc/php/8.3/fpm/conf.d/99-outsee.ini.
;  Repris de docker/php.ini, adapté à un déploiement atomique.
; ============================================================

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
date.timezone = Europe/Paris

; ─── OPcache ────────────────────────────────────────────────────────────
; Le déploiement bascule un lien symbolique (deploy/deployer.sh) puis
; recharge PHP-FPM : la revalidation des fichiers devient inutile.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = disable

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ─── APCu : le cache partagé de l'application (includes/cache.php) ────────
; Sans APCu, le cache retombe sur des fichiers dans /tmp, relus à chaque
; requête (le classement pèse plusieurs Mo).
apc.enabled = 1
apc.shm_size = 256M
apc.enable_cli = 0

; ─── Sessions (espace pro et administration) ─────────────────────────────
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.gc_maxlifetime = 86400

; ─── Envois ─────────────────────────────────────────────────────────────
upload_max_filesize = 8M
post_max_size = 10M
max_execution_time = 30
