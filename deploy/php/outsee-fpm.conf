; ============================================================
;  Outsee — pool PHP-FPM (VPS-4 OVH : 12 vCores, 48 Go)
;  Installé dans /etc/php/8.3/fpm/pool.d/outsee.conf.
;
;  Dimensionnement : un processus de l'API occupe 25 à 40 Mo ; 80
;  processus tiennent en 3 à 4 Go, très loin des 48 Go. 80 requêtes en
;  vol, c'est environ deux fois le pic estimé pour 10 000 utilisateurs
;  simultanés (2 000 requêtes/s × 20 ms). Monter max_children n'aide pas
;  si le CPU est saturé : mesurer d'abord (outils/charge.php).
; ============================================================

[outsee]
user = www-data
group = www-data

listen = /run/php/outsee.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 4096

pm = static
pm.max_children = 80
pm.max_requests = 1000

request_terminate_timeout = 30s
request_slowlog_timeout = 3s
slowlog = /var/log/php8.3-fpm-outsee-lent.log

; PHP-FPM efface l'environnement (clear_env) : APP_ENV doit être posé ici.
; Sans lui, l'application refuse déjà d'afficher ses erreurs (voir
; estEnDeveloppement()), mais d'autres réglages dépendent de la production.
; Les secrets (base, Stripe, SMTP) vont dans includes/config.local.php,
; pas ici : ce fichier peut être lu par d'autres comptes du serveur.
env[APP_ENV] = production

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size] = 10M
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.3-fpm-outsee.log
