# ============================================================
#  Outsee — nginx sur le VPS OVH
#
#  Installé par deploy/installer_serveur.sh dans
#  /etc/nginx/sites-available/outsee.conf, __DOMAINE__ remplacé par le
#  domaine (ex. outsee.fr). Le site est servi à la racine du domaine :
#  l'application mobile appelle https://__DOMAINE__/api/v1/.
#
#  Sous nginx, AUCUN .htaccess du dépôt ne s'applique : tout ce qu'ils
#  protégeaient (dossiers internes, fichiers SQL, exécution de PHP dans
#  uploads/) est repris ici. Ne pas retirer ces blocs.
# ============================================================

# Connexion : 10 essais par minute et par adresse, rafale de 20. En plus du
# limiteur de l'application (login_attempts), qui compte par compte.
limit_req_zone $binary_remote_addr zone=outsee_connexion:10m rate=10r/m;
limit_req_status 429;

# Tout hôte inconnu est refusé : l'application ne doit jamais répondre à un
# en-tête Host qu'elle n'a pas choisi (liens de réinitialisation forgés).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# HTTP → HTTPS (et le défi Let's Encrypt).
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAINE__ www.__DOMAINE__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://__DOMAINE__$request_uri;
    }
}

# www → domaine nu.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.__DOMAINE__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAINE__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAINE__/privkey.pem;

    return 301 https://__DOMAINE__$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAINE__;

    # `current` est un lien vers la version déployée (deploy/deployer.sh).
    # $realpath_root plus bas : PHP et OPcache voient le vrai dossier, et une
    # bascule de version prend effet sans servir un mélange des deux.
    root /var/www/outsee/current;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/__DOMAINE__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAINE__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OUTSEE_SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Les en-têtes de setSecurityHeaders() ne couvrent que les pages PHP :
    # ceux-ci valent aussi pour les fichiers statiques.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 8m;
    server_tokens off;

    # Cloudflare devant le VPS ? Décommenter, avec la liste de ses plages
    # (https://www.cloudflare.com/ips/), pour que les limiteurs voient
    # l'adresse du visiteur et non celle de Cloudflare.
    # set_real_ip_from 173.245.48.0/20;  # … une ligne par plage
    # real_ip_header CF-Connecting-IP;

    # ─── Ce qui ne se sert jamais ────────────────────────────────────────
    location ~ /\.(?!well-known/) {
        return 404;
    }
    location ~ ^/(includes|outils|cron|tests|docker|deploy|vendor|mobile|docs)(/|$) {
        return 404;
    }
    location ~* \.(sql|md|neon|lock|dist|log|bak|old|swp|toml|phar|sh|bat|ps1|ini|conf|yml|yaml|py|docx|pptx|xlsx|pdf|mp4)$ {
        return 404;
    }
    location ~ ^/(composer\.(json|lock)|package(-lock)?\.json|phpunit\.xml|phpstan\.neon|Dockerfile|nixpacks\.toml|__shot\.php)$ {
        return 404;
    }

    # ─── Fichiers envoyés : des images, jamais du code ─────────────────────
    location ^~ /uploads/ {
        location ~* \.(php|phtml|phar|pl|py|cgi|sh)$ {
            return 404;
        }
        # Noms aléatoires, jamais réécrits : cache long.
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ─── Statiques (empreinte ?v= posée par asset()) ──────────────────────
    location ^~ /assets/ {
        location ~* \.php$ {
            return 404;
        }
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ─── Connexion : limite de débit ──────────────────────────────────────
    location = /api/v1/login.php {
        limit_req zone=outsee_connexion burst=20 nodelay;
        include /etc/nginx/snippets/outsee-php.conf;
    }
    location = /auth/login.php {
        limit_req zone=outsee_connexion burst=20 nodelay;
        include /etc/nginx/snippets/outsee-php.conf;
    }

    # ─── Webhooks Stripe : POST seulement ─────────────────────────────────
    location = /webhooks/stripe.php {
        limit_except POST {
            deny all;
        }
        include /etc/nginx/snippets/outsee-php.conf;
    }
    location ^~ /webhooks/ {
        return 404;
    }

    # ─── PHP ──────────────────────────────────────────────────────────────
    location ~ \.php$ {
        include /etc/nginx/snippets/outsee-php.conf;
    }

    location / {
        try_files $uri $uri/ =404;
    }

}
