# Outsee — en-têtes de sécurité communs.
# Installé dans /etc/nginx/snippets/outsee-entetes.conf.
#
# nginx n'hérite des add_header du bloc server que si la location n'en pose
# aucun : une location qui ajoute son propre Cache-Control perd HSTS et
# X-Frame-Options. Ce fichier est donc inclus dans le bloc server ET dans
# chaque location qui pose ses propres en-têtes (/uploads, /assets).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
