# Outsee — passage d'une requête à PHP-FPM.
# Installé dans /etc/nginx/snippets/outsee-php.conf.

try_files $uri =404;
fastcgi_split_path_info ^(.+\.php)(/.+)$;
include fastcgi_params;

# $realpath_root : le vrai dossier de la version, pas le lien `current`.
fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
fastcgi_param DOCUMENT_ROOT   $realpath_root;
fastcgi_param HTTPS on;
# L'API lit le jeton Bearer dans HTTP_AUTHORIZATION : nginx le transmet tel quel.

fastcgi_pass unix:/run/php/outsee.sock;
fastcgi_read_timeout 30s;
fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;
