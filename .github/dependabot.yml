# Mises à jour de dépendances en Pull Requests séparées, une par paquet.
# Les messages suivent les Conventional Commits (voir CONTRIBUTING.md) :
# « build(deps): bump … » pour le code, « ci(deps): bump … » pour les workflows.
version: 2

updates:
  # PHP : composer.json à la racine.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"

  # Application mobile : mobile/package.json. Expo impose ses versions de
  # paquets par SDK : les montées majeures d'Expo se font à la main
  # (`npx expo install --fix`), pas par Dependabot.
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Actions GitHub utilisées par .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
