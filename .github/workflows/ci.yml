name: CI

# Sur toute branche poussee, et non plus seulement main et develop.
#
# Le travail se fait sur des branches thematiques - perf/montee-en-charge en
# portait neuf commits, plus un lot entier non enregistre - et aucune n'etait
# verifiee avant d'atteindre main. Une CI qui ne tourne qu'apres la fusion
# apprend trop tard qu'un test casse sous PHP 8.1.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  quality:
    name: Tests & Static Analysis
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_sqlite, mbstring, json
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP Lint (syntax check)
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PHPStan static analysis
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: PHPUnit tests
        run: vendor/bin/phpunit --colors=always --testdox

  mobile:
    name: Application mobile (lint & tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 24 : le lanceur de tests intégré exécute le TypeScript tel quel,
      # sans transpileur ni bibliothèque de test à installer.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  integration-mysql:
    name: Intégration MariaDB (installation, comptes)
    runs-on: ubuntu-latest

    # Les autres tests d'intégration tournent sur SQLite. Ceux-ci ont besoin
    # d'une vraie base : la suppression de compte dépend des clés étrangères et
    # des ENUM du schéma réel, et l'import de db_setup.sql vérifie en passant
    # que l'installation complète fonctionne — ce que SchemaTest, qui lit des
    # fichiers, ne peut pas dire.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: linkee_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, json
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # db_setup.sql crée et sélectionne sa propre base `linkee` : on retire ces
      # deux lignes pour qu'il s'exécute dans la base de test.
      - name: Installer le schéma
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client
          grep -v '^CREATE DATABASE IF NOT EXISTS linkee' db_setup.sql | grep -v '^USE linkee;' > /tmp/setup.sql
          mariadb --protocol=tcp -h 127.0.0.1 -u root linkee_test < /tmp/setup.sql

      - name: Tests d'intégration MariaDB
        env:
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=linkee_test;charset=utf8mb4
          TEST_MYSQL_USER: root
        run: vendor/bin/phpunit --testsuite Integration --testdox
