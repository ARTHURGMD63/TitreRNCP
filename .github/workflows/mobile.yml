# ============================================================
#  Construction de l'application mobile pour les tests.
#
#  À lancer à la main : onglet Actions → « Application mobile » →
#  Run workflow. Deux fichiers sortent, à télécharger en bas de la page
#  du run (« Artifacts ») :
#
#    outsee-android   Outsee.apk — s'installe directement sur un Android
#                     (autoriser les « sources inconnues »).
#    outsee-ios       Outsee.ipa — NON signé. Sideloadly le signe avec
#                     l'identifiant Apple de la personne qui l'installe.
#
#  Aucun compte Expo ni Apple Developer n'est nécessaire : tout est
#  construit ici, sur les machines de GitHub (gratuites pour un dépôt
#  public, Mac compris).
#
#  À régler UNE fois : Settings → Secrets and variables → Actions →
#  onglet « Variables » → New repository variable :
#
#    EXPO_PUBLIC_API_URL   https://outsee.fr   (le domaine du VPS OVH)
#
#  L'adresse publique du serveur, en https, sans barre finale. Elle est
#  inscrite dans l'application au moment de la construction : la changer
#  demande de relancer ce workflow. En http, iOS bloquerait les requêtes.
# ============================================================

name: Application mobile

on:
  workflow_dispatch:
  # GitHub n'affiche « Run workflow » que pour les workflows de la branche
  # par défaut. Une étiquette, elle, lance la construction depuis n'importe
  # quelle branche :  git tag mobile-v1 && git push origin mobile-v1
  push:
    tags: ['mobile-v*']

permissions:
  contents: read

env:
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
  # Clé Google Maps Android (onglet « Secrets ») : sans elle, l'écran Carte
  # plante sur Android. Voir mobile/app.config.js.
  GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Vérifier l'adresse du serveur
        run: |
          case "$EXPO_PUBLIC_API_URL" in
            https://*) echo "Serveur : $EXPO_PUBLIC_API_URL" ;;
            *) echo "::error::Renseigner la variable EXPO_PUBLIC_API_URL (https://…) dans Settings → Variables."; exit 1 ;;
          esac

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Même version que la CI (ci.yml), où passent les tests.
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      # Numéro de build lu dans l'étiquette (mobile-v42 → 42) : voir
      # mobile/app.config.js. Sans étiquette (lancement manuel), rien n'est imposé.
      - name: Numéro de build
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            mobile-v[0-9]*) echo "OUTSEE_BUILD=${GITHUB_REF_NAME#mobile-v}" >> "$GITHUB_ENV" ;;
          esac

      # Génère le projet Android natif à partir d'app.json (dossier jetable,
      # jamais versionné).
      - run: npx expo prebuild --platform android --no-install

      # Le gabarit d'Expo signe la version « release » avec la clé de
      # débogage : l'APK s'installe tel quel sur un téléphone de test.
      - name: Construire l'APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android

      - run: cp android/app/build/outputs/apk/release/app-release.apk Outsee.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: outsee-android
          path: mobile/Outsee.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Vérifier l'adresse du serveur
        run: |
          case "$EXPO_PUBLIC_API_URL" in
            https://*) echo "Serveur : $EXPO_PUBLIC_API_URL" ;;
            *) echo "::error::Renseigner la variable EXPO_PUBLIC_API_URL (https://…) dans Settings → Variables."; exit 1 ;;
          esac

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Même version que la CI (ci.yml), où passent les tests.
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      # Numéro de build lu dans l'étiquette (mobile-v42 → 42) : voir
      # mobile/app.config.js. Sans étiquette (lancement manuel), rien n'est imposé.
      - name: Numéro de build
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            mobile-v[0-9]*) echo "OUTSEE_BUILD=${GITHUB_REF_NAME#mobile-v}" >> "$GITHUB_ENV" ;;
          esac

      # Génère le projet Xcode et installe les CocoaPods.
      - run: npx expo prebuild --platform ios

      # Archive SANS signature : c'est Sideloadly qui signera, avec
      # l'identifiant Apple de la personne qui installe.
      #
      # Le nom du workspace et du scheme vient du champ « name » d'app.json,
      # casse comprise (« outsee » donne outsee.xcworkspace et le scheme
      # outsee). On le lit dans ce que prebuild a généré au lieu de l'écrire
      # en dur : xcodebuild distingue les majuscules pour le scheme.
      - name: Construire l'application
        run: |
          workspace=$(ls -d ios/*.xcworkspace | head -n 1)
          scheme=$(basename "$workspace" .xcworkspace)
          echo "Workspace : $workspace — scheme : $scheme"
          xcodebuild -list -workspace "$workspace"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Outsee.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # Un .ipa n'est qu'une archive zip contenant Payload/<Nom>.app.
      - name: Empaqueter le .ipa
        run: |
          mkdir -p Payload
          cp -R build/Outsee.xcarchive/Products/Applications/*.app Payload/
          zip -qr Outsee.ipa Payload

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: outsee-ios
          path: mobile/Outsee.ipa
