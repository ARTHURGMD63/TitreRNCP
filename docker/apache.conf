# ============================================================
#  Linkee — réglages Apache de production
#
#  L'image php:8.3-apache tourne en mpm_prefork avec mod_php : un processus
#  par requête en cours, et PHP embarqué dedans. C'est le modèle le plus
#  simple à exploiter, et de loin ce qui se rapproche le plus de
#  l'hébergement mutualisé sur lequel l'application est déployée — mêmes
#  règles .htaccess, mêmes contraintes, donc pas de surprise entre les deux.
# ============================================================

# ─── Dimensionnement ────────────────────────────────────────────────────────
#
# Chaque processus Apache avec mod_php occupe 40 à 60 Mo. MaxRequestWorkers
# est donc d'abord une limite de mémoire, pas une limite d'utilisateurs :
# 48 × 60 Mo ≈ 2,8 Go dans le pire des cas, ce qui tient sur un serveur de
# 4 Go en laissant la place à MySQL.
#
# Ne pas confondre avec le nombre d'utilisateurs simultanés : une requête
# servie en 50 ms libère son processus 20 fois par seconde. 48 processus
# soutiennent donc de l'ordre de 900 requêtes par seconde — très au-delà des
# ~100 req/s que représentent mille personnes en train de naviguer.
#
# Le vrai risque n'est pas d'en avoir trop peu, c'est d'en avoir trop : au-delà
# de ce que la mémoire permet, la machine se met à échanger sur le disque et
# le débit s'effondre au lieu de plafonner.
<IfModule mpm_prefork_module>
    StartServers             8
    MinSpareServers          8
    MaxSpareServers         16
    MaxRequestWorkers       48
    # Recyclage des processus : borne les fuites mémoire lentes, sans payer
    # un redémarrage trop souvent.
    MaxConnectionsPerChild 2000
</IfModule>

# ─── Connexions persistantes ────────────────────────────────────────────────
#
# Une page du hub charge le CSS, deux scripts et plusieurs images. Sans
# KeepAlive, chaque fichier rouvre une connexion TCP — et une poignée de main
# TLS. Le délai est court à dessein : un processus qui attend la prochaine
# requête d'un client est un processus qui n'en sert aucun autre.
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 3

# Un client qui n'envoie rien ne doit pas immobiliser un processus.
Timeout 60

# ─── Compression ────────────────────────────────────────────────────────────
#
# 87 Ko de CSS et 46 Ko de JS descendent aux alentours de 20 Ko une fois
# compressés. Multiplié par mille visiteurs, c'est l'écart entre saturer le
# lien du serveur et ne pas le remarquer.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml
    # text/javascript et non seulement application/javascript : c'est le type
    # qu'Apache 2.4 sert pour un .js, et l'oublier laissait passer en clair
    # les 634 Ko de JavaScript de l'application — soit l'essentiel de ce que
    # cette section est censee economiser.
    AddOutputFilterByType DEFLATE text/javascript application/javascript application/x-javascript
    AddOutputFilterByType DEFLATE application/manifest+json
    AddOutputFilterByType DEFLATE application/json application/xml
    AddOutputFilterByType DEFLATE image/svg+xml
    # Les JPEG, PNG et WebP sont déjà compressés : les repasser à gzip coûte
    # du processeur pour gagner quelques octets, parfois pour en perdre.
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|woff2?|mp4)$ no-gzip dont-vary
</IfModule>

# ─── Ce que le serveur annonce ──────────────────────────────────────────────
ServerTokens Prod
ServerSignature Off
# Les journaux d'accès partent sur la sortie standard du conteneur, où
# l'hébergeur sait les collecter.
