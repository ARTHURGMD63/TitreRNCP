; ============================================================
;  StudentLink — réglages PHP de production
;
;  Ce fichier est copié dans conf.d/ : il surcharge le php.ini-production
;  de l'image officielle, et lui seul.
; ============================================================

; ─── OPcache ────────────────────────────────────────────────────────────────
;
; Le réglage le plus rentable de tout ce dépôt, et il tient en six lignes.
;
; Sans OPcache, PHP relit, analyse et recompile CHAQUE fichier source à CHAQUE
; requête. explore.php fait 55 Ko, et tire une douzaine de require : c'est
; environ un demi-mégaoctet de PHP recompilé pour afficher une page, mille
; fois par minute, pour produire exactement le même bytecode.
;
; Avec OPcache, cette compilation a lieu une fois, et le bytecode est partagé
; entre tous les processus du serveur. Le gain typique sur une application
; sans framework de cette taille est d'un facteur 3 à 5 sur le temps CPU.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
; Le dépôt compte environ 80 fichiers PHP ; la marge couvre vendor/ et la
; croissance. En dessous du nombre réel de fichiers, OPcache se met à évincer
; du bytecode en permanence et le cache devient contre-productif.
opcache.max_accelerated_files=10000

; validate_timestamps=0 supprime le stat() par fichier et par requête, mais
; impose de vider OPcache à chaque déploiement, sinon l'ancien code continue
; de tourner. Le déploiement se fait par FTP, fichier par fichier, sans point
; de reprise identifiable : on garde donc la revalidation, espacée à 60 s.
; C'est le compromis honnête ici — passer à 0 le jour où le déploiement sera
; atomique (conteneur remplacé, lien symbolique basculé).
opcache.validate_timestamps=1
opcache.revalidate_freq=60
opcache.save_comments=1
opcache.fast_shutdown=1

; ─── Cache des chemins ──────────────────────────────────────────────────────
;
; Chaque require résout un chemin, ce qui coûte plusieurs appels système.
; Le cache par défaut (16 Ko) est trop petit dès qu'un projet a des dépendances,
; et le défaut de 120 s le fait expirer sans cesse.
realpath_cache_size=4096K
realpath_cache_ttl=600

; ─── Limites ────────────────────────────────────────────────────────────────
;
; Alignées sur ce que le code attend réellement : UPLOAD_MAX_BYTES vaut 2 Mo
; dans includes/uploads.php. post_max_size doit rester au-dessus pour laisser
; passer les autres champs du formulaire.
memory_limit=128M
upload_max_filesize=2M
post_max_size=8M
max_execution_time=30
; Une requête bloquée sur l'envoi d'un e-mail ou une base qui ne répond pas
; garde un processus Apache occupé. Au-delà de 60 s, elle est perdue de toute
; façon : autant rendre le processus à la file.
max_input_time=60

; ─── Sessions ───────────────────────────────────────────────────────────────
;
; Le ramassage des sessions expirées est déclenché au hasard des requêtes.
; À 1 %, sur une application très sollicitée, c'est déjà une fois toutes les
; cent requêtes — largement assez, et cela évite le balayage de répertoire
; qui se produit avec le réglage par défaut plus agressif.
session.gc_probability=1
session.gc_divisor=100
; 30 jours, pour correspondre à delaiInactivite() côté application : une
; session supprimée par PHP avant l'échéance applicative déconnecterait
; l'utilisateur sans explication.
session.gc_maxlifetime=2592000
session.sid_length=48
session.sid_bits_per_character=5

; ─── Ce que le serveur ne doit pas raconter ─────────────────────────────────
expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT

; ─── Sortie ─────────────────────────────────────────────────────────────────
;
; La compression est faite par mod_deflate d'Apache, qui couvre aussi les
; fichiers statiques que PHP ne voit jamais. L'activer des deux côtés
; compresserait deux fois.
zlib.output_compression=Off
; Un tampon de sortie évite d'envoyer la page par petits morceaux : moins de
; paquets réseau, et les en-têtes restent modifiables plus longtemps.
output_buffering=8192
